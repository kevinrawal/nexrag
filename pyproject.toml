[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "nexrag"
version = "0.3.2"
description = "Framework-agnostic RAG pipeline SDK. Plug in any component, swap any stage, configure everything in YAML"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "KevinRawal", email = "kevinrawal30@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "llm",
    "vector-database",
    "embeddings",
    "ai",
    "nlp",
    "pipeline",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Keep this minimal. Only what the pipeline skeleton needs.
dependencies = [
    "chromadb>=1.5.9",
    "openai>=2.38.0",
    "pydantic>=2.0",   # config schema validation
    "pyyaml>=6.0",     # YAML config loading
]

[project.optional-dependencies]

# Provider extras — install only what you use
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.20",
]
ollama = [
    "ollama>=0.1",
    "httpx>=0.27",
]
chromadb = [
    "chromadb>=0.5",
]
huggingface = [
    "huggingface-hub>=0.20",
]

# Document loaders
pdf = [
    "pypdf>=4.0",
]
word = [
    "python-docx>=1.0",
]
excel = [
    "openpyxl>=3.1",
]
html = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
bm25 = [
    "rank-bm25>=0.2",
]
cohere = [
    "cohere>=5.0",
]
cross-encoder = [
    "sentence-transformers>=2.7",
]

# Convenience bundles
all-providers = [
    "nexrag[openai]",
    "nexrag[anthropic]",
    "nexrag[ollama]",
    "nexrag[chromadb]",
    "nexrag[huggingface]",
]
all-loaders = [
    "nexrag[pdf]",
    "nexrag[word]",
    "nexrag[excel]",
    "nexrag[html]",
]
all-sparse = [
    "nexrag[bm25]",
]
all-rerankers = [
    "nexrag[cohere]",
    "nexrag[cross-encoder]",
]
all-retrieval = [
    "nexrag[all-sparse]",
    "nexrag[all-rerankers]",
]
# Full bundle — dev/CI only; installs heavy deps (PyTorch via sentence-transformers)
all = [
    "nexrag[all-providers]",
    "nexrag[all-loaders]",
    "nexrag[all-retrieval]",
]

# Dev dependencies
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",        # linter + formatter
    "mypy>=1.10",       # type checker
    "pre-commit>=3.7",
    "types-pyyaml",
    "rank-bm25>=0.2",   # BM25Retriever tests run the real algorithm, not a mock
]

[project.urls]
Homepage = "https://github.com/kevinrawal/nexrag"
Repository = "https://github.com/kevinrawal/nexrag"
Issues = "https://github.com/kevinrawal/nexrag/issues"
Changelog = "https://github.com/kevinrawal/nexrag/blob/main/CHANGELOG.md"

# Ruff (linter + formatter)

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["nexrag"]

# Mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# Optional deps without type stubs — suppress regardless of install state
[[tool.mypy.overrides]]
module = ["rank_bm25", "rank_bm25.*"]
ignore_missing_imports = true

# Pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live services (deselect with '-m not integration')",
    "unit: marks fast, isolated unit tests",
]

[tool.coverage.run]
source = ["src/nexrag"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
