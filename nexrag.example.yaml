# nexrag.example.yaml
#
# Copy this file to nexrag.yaml and fill in your values.
# All API keys must be set via environment variables — never hardcode them here.
#
# Usage:
#   cp nexrag.example.yaml nexrag.yaml
#   export OPENAI_API_KEY=sk-...
#   python -c "from nexrag import NexRAG; p = NexRAG.from_config(); print(p.query('hello'))"

# ── Ingestion pipeline ──────────────────────────────────────────────────────────

ingestion:

  # Loader: how raw data is read into Documents.
  # type: auto   → no built-in loader; you must pass a loader to ingest() at call time,
  #                or call ingest_documents() with pre-built Document objects.
  # type: pdf    → loads PDF files (requires nexrag[pdf])
  # type: txt    → loads plain text files / strings
  # type: custom → bring your own loader (requires 'class:' field below)
  loader:
    type: pdf                           # auto | pdf | txt | custom
    # class: myapp.loaders.MyLoader    # dotted path — required when type: custom
    # params:
    #   source_override: "my-source"   # passed as kwargs to __init__

  # Chunker: splits Documents into retrievable Chunks.
  chunker:
    strategy: recursive                 # recursive | custom
    chunk_size: 512                     # max characters per chunk
    chunk_overlap: 64                   # overlap between consecutive chunks
    min_chunk_size: 50                  # chunks below this size are dropped
    # class: myapp.chunkers.MyChunker  # required when strategy: custom

  # Embedder: converts chunk text to vectors.
  embedder:
    provider: openai                    # openai | ollama | huggingface | custom
    model: text-embedding-3-small       # text-embedding-3-small | text-embedding-3-large | text-embedding-ada-002
    api_key: ${OPENAI_API_KEY}          # required for openai — set via env var
    # base_url: ${OPENAI_BASE_URL:-}    # optional: custom endpoint (Azure, proxy)
    batch_size: 100                     # texts per API call
    # max_retries: 2                    # retry attempts on transient failures (0 = no retries)

  # Vector DB: stores chunks and their vectors.
  vector_db:
    provider: chroma                    # chroma | custom
    default_collection: documents       # must match a key under collections:
    on_conflict: overwrite              # overwrite | skip | append

    collections:
      documents:
        mode: persistent                # persistent | memory | server
        path: ./.nexrag/chroma          # local storage path (persistent mode only)
        # host: chroma.internal         # server hostname (server mode only)
        # port: 8000                    # server port (server mode only)

    # class: myapp.stores.MyVectorDB    # required when provider: custom
    # params:
    #   index_name: my-index

  # Sanitizer: optional pre-processing step before chunking.
  # Disabled by default. Provide a custom class to enable.
  sanitizer:
    enabled: false
    # class: myapp.sanitizers.MySanitizer
    # params: {}

# ── Query pipeline ──────────────────────────────────────────────────────────────

query:

  # Embedder for queries. 'inherit' reuses the ingestion embedder (recommended).
  # Must be the same model used during ingestion — different models produce
  # incompatible vectors and will cause poor or wrong retrieval results.
  embedder: inherit                     # inherit | openai | ollama | huggingface | custom

  # Retriever: finds the most relevant chunks for a query vector.
  retriever:
    provider: dense                     # dense | custom
    top_k: 5                            # number of chunks to retrieve
    score_threshold: 0.0                # minimum cosine similarity (0.0 = return all)
    # class: myapp.retrievers.MyRetriever

  # LLM: generates the final answer from the retrieved context.
  llm:
    provider: openai                    # openai | ollama | anthropic | custom
    model: gpt-4o                       # gpt-4o | gpt-4o-mini | gpt-3.5-turbo
    api_key: ${OPENAI_API_KEY}          # required for openai
    # base_url: ${OPENAI_BASE_URL:-}    # optional: Azure OpenAI or proxy
    temperature: 0.2                    # 0.0 = deterministic, 1.0 = creative
    max_tokens: 1024                    # max tokens in the response
    timeout: 30                         # request timeout in seconds
    # max_retries: 2                    # retry attempts on transient failures (0 = no retries)

  # Prompt: controls how context and query are assembled into the LLM prompt.
  prompt:
    system: |
      You are a helpful assistant. Answer the user's question using only the
      context provided below. If the answer is not in the context, say
      "I don't know based on the provided documents."
    context_format: numbered            # numbered | labeled | plain
    # class: myapp.prompts.MyPromptBuilder  # custom prompt builder

# ── Observability ───────────────────────────────────────────────────────────────
# Requires: pip install nexrag[observability]
# NexRAG emits metrics, traces, and logs via OpenTelemetry.
# Connect Prometheus + Grafana for the dashboard path, or push to any OTel Collector.

observability:
  enabled: true
  service_name: nexrag
  resource_attributes:
    deployment.environment: production

  signals:
    metrics: true
    traces: true
    logs: true

  exporters:
    prometheus:
      enabled: true
      host: 0.0.0.0
      port: 9464                        # GET /metrics — add to prometheus.yml scrape_configs

    otlp:
      enabled: false
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      protocol: grpc                    # grpc | http
      # headers:
      #   Authorization: Bearer ${GRAFANA_CLOUD_TOKEN}
      insecure: true

    console:
      enabled: false                    # structured JSON to stdout (dev/debug only)

  metrics:
    retrieval: true                     # top_score, avg_score, score_spread, empty_results, ...
    llm: true                           # tokens_input/output, latency, finish_reason, ...
    cost: true                          # cost_per_query_usd (requires pricing table below)
    embedding: true                     # embed_latency_ms, dimensions, batch_count
    ingestion: true                     # docs_loaded, chunks_written, failed_docs, ...
    pipeline: true                      # e2e_latency, throughput, errors
    pricing:
      gpt-4o:      { input: 0.0025,  output: 0.01 }
      gpt-4o-mini: { input: 0.00015, output: 0.0006 }
      claude-haiku-4-5-20251001: { input: 0.00025, output: 0.00125 }

  # Optional — LLM-as-judge metrics (faithfulness, relevance, etc.)
  # Runs off the response path on a sampled fraction of queries.
  evaluations:
    enabled: false
    sample_rate: 0.1                    # evaluate 10% of queries globally
    max_concurrency: 4

    faithfulness:
      enabled: false
      sample_rate: 0.2                  # per-metric override
      llm:
        provider: anthropic
        model: claude-haiku-4-5-20251001
        api_key: ${ANTHROPIC_API_KEY}

    answer_relevance:
      enabled: false
      llm:
        provider: openai
        model: gpt-4o-mini
        api_key: ${OPENAI_API_KEY}
      embedder:
        provider: openai
        model: text-embedding-3-small
        api_key: ${OPENAI_API_KEY}

    context_diversity:
      enabled: false
      embedder:
        provider: openai
        model: text-embedding-3-small
        api_key: ${OPENAI_API_KEY}

  # Escape hatch — bring your own BaseObserver subclass.
  # class: myapp.observers.MyObserver
  # params: {}

