# nexrag.yaml — NexRAG V1 Example Configuration
# Copy this file into your project and adjust values.
# This is the single source of truth for your entire pipeline.

nexrag:
  version: "1.0"

# INGESTION PIPELINE

ingestion:

  loader:
    type: auto          # auto | pdf | txt | excel | json | code | word | html
    # type: custom
    # class: myproject.loaders.MyCustomLoader

  sanitizer:
    enabled: false      # false = PassthroughSanitizer (no-op)
    # enabled: true
    # class: myproject.sanitizers.RemoveBoilerplateSanitizer

  chunker:
    strategy: recursive # fixed | sentence | paragraph | recursive | custom
    chunk_size: 512
    chunk_overlap: 64
    min_chunk_size: 50
    # strategy: custom
    # class: myproject.chunkers.SemanticChunker
    # params:
    #   similarity_threshold: 0.8

  embedder:
    provider: openai
    model: text-embedding-3-small
    api_key: ${OPENAI_API_KEY}
    # provider: huggingface
    # model: sentence-transformers/all-MiniLM-L6-v2
    # provider: ollama
    # model: nomic-embed-text
    # base_url: http://localhost:11434

  vector_db:
    provider: chroma
    default_collection: documents
    collections:
      documents:
        path: ./.nexrag/chroma
        # description: "Main document store"

  on_conflict: overwrite  # overwrite | skip | append

# QUERY PIPELINE

query:

  embedder: inherit       # reuse ingestion embedder config

  retriever:
    top_k: 5
    score_threshold: 0.6
    metadata_filter: ~
    #   file_type: pdf
    #   department: legal

  prompt:
    system: |
      You are a helpful assistant. Answer the user's question using only
      the context provided. If the answer is not in the context, say so
      clearly. Do not make up information.
    template: ~           # null = NexRAG default template
    # template_class: myproject.prompts.MyPromptBuilder

  llm:
    provider: openai
    model: gpt-4o
    api_key: ${OPENAI_API_KEY}
    temperature: 0.2
    max_tokens: 1024
    streaming: false
    # provider: anthropic
    # model: claude-sonnet-4-20250514
    # api_key: ${ANTHROPIC_API_KEY}
    # provider: ollama
    # model: llama3
    # base_url: http://localhost:11434

# OBSERVABILITY
# NexRAG emits metrics, traces, and logs via OpenTelemetry.
# Requires: pip install nexrag[observability]
# Data retention is fully managed by your backend (Prometheus TSDB, Tempo, Loki).

observability:
  enabled: true
  service_name: nexrag
  # resource_attributes:
  #   deployment.environment: production
  #   service.version: "0.4.0"

  signals:
    metrics: true
    traces: true
    logs: true

  exporters:
    # Prometheus pull — exposes GET /metrics for Prometheus to scrape.
    prometheus:
      enabled: true
      host: 0.0.0.0
      port: 9464

    # OTLP push — sends to an OTel Collector / Grafana Alloy (metrics + traces + logs).
    otlp:
      enabled: false
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      protocol: grpc          # grpc | http
      # headers:
      #   Authorization: Bearer ${GRAFANA_CLOUD_TOKEN}
      insecure: true

    # Console exporter (debug only — structured JSON to stdout, not raw print).
    console:
      enabled: false

  metrics:
    retrieval: true
    llm: true
    cost: true
    embedding: true
    ingestion: true
    pipeline: true
    # Model pricing table for llm.cost_per_query_usd (USD per 1K tokens).
    # pricing:
    #   gpt-4o:      { input: 0.0025,  output: 0.01 }
    #   gpt-4o-mini: { input: 0.00015, output: 0.0006 }
    #   claude-haiku-4-5-20251001: { input: 0.00025, output: 0.00125 }

  # Optional LLM-as-judge evaluations — runs off the response path on a sample.
  # Requires: pip install nexrag[observability] + provider extras for each model.
  evaluations:
    enabled: false
    sample_rate: 0.1        # global default: evaluate 10% of queries
    max_concurrency: 4

    faithfulness:
      enabled: false
      # sample_rate: 0.2    # per-metric override
      # llm:
      #   provider: anthropic
      #   model: claude-haiku-4-5-20251001
      #   api_key: ${ANTHROPIC_API_KEY}

    answer_relevance:
      enabled: false
      # llm:
      #   provider: openai
      #   model: gpt-4o-mini
      #   api_key: ${OPENAI_API_KEY}
      # embedder:
      #   provider: openai
      #   model: text-embedding-3-small
      #   api_key: ${OPENAI_API_KEY}

    answer_completeness:
      enabled: false
      # llm:
      #   provider: openai
      #   model: gpt-4o-mini
      #   api_key: ${OPENAI_API_KEY}

    answer_coherence:
      enabled: false
      # llm:
      #   provider: openai
      #   model: gpt-4o-mini
      #   api_key: ${OPENAI_API_KEY}

    context_diversity:
      enabled: false
      # embedder:
      #   provider: openai
      #   model: text-embedding-3-small
      #   api_key: ${OPENAI_API_KEY}

  # Escape hatch — bring your own BaseObserver subclass.
  # class: myproject.observers.DatadogObserver
  # params: {}
